#######################################################
# Nginx Configuration for Teleroute Marketplace
# Production-ready configuration with security headers
#######################################################

# Upstream PHP-FPM
upstream php-fpm {
    server unix:/var/run/php/php8.2-fpm.sock;
    # Alternative: server 127.0.0.1:9000;
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=200r/m;

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name teleroute-marketplace.com www.teleroute-marketplace.com;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/teleroute-marketplace;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name teleroute-marketplace.com www.teleroute-marketplace.com;

    root /var/www/teleroute-marketplace;
    index index.php index.html;

    charset utf-8;

    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/teleroute-marketplace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teleroute-marketplace.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/teleroute-marketplace.com/chain.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Diffie-Hellman parameter
    ssl_dhparam /etc/nginx/dhparam.pem;

    # Logging
    access_log /var/log/nginx/teleroute-access.log combined buffer=32k;
    error_log /var/log/nginx/teleroute-error.log warn;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self';" always;

    # GZIP Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Client Body Size (for file uploads)
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Hide Nginx version
    server_tokens off;

    # Default location
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP processing
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # PHP FastCGI settings
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 300;

        # Security
        fastcgi_param PHP_VALUE "upload_max_filesize=10M \n post_max_size=10M";
        fastcgi_param PHP_ADMIN_VALUE "open_basedir=/var/www/teleroute-marketplace:/tmp";
    }

    # API endpoints - separate rate limiting
    location ~ ^/api/ {
        limit_req zone=api_limit burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Login/Auth - strict rate limiting
    location ~ ^/(login|register|reset-password)\.php$ {
        limit_req zone=login_limit burst=3 nodelay;
        try_files $uri =404;
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Health check endpoint
    location = /health-check.php {
        access_log off;
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(css|js|woff|woff2|ttf|eot)$ {
        expires 1M;
        add_header Cache-Control "public";
        access_log off;
    }

    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    location ~ /\.git {
        deny all;
    }

    # Deny access to config directory
    location ~ ^/config/ {
        deny all;
    }

    # Deny access to database directory
    location ~ ^/database/ {
        deny all;
    }

    # Deny access to scripts directory
    location ~ ^/scripts/ {
        deny all;
    }

    # Deny access to logs
    location ~ ^/logs/ {
        deny all;
    }

    # Deny access to vendor (if using Composer)
    location ~ ^/vendor/ {
        deny all;
    }

    # Deny PHP execution in uploads directory
    location ~ ^/uploads/.*\.php$ {
        deny all;
    }

    # Admin panel - optional IP whitelist
    location ~ ^/admin/ {
        # Uncomment to restrict by IP
        # allow 192.168.1.0/24;
        # deny all;

        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Robots.txt
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Sitemap
    location = /sitemap.xml {
        access_log off;
        log_not_found off;
    }

    # Favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Error pages
    error_page 404 /404.php;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /var/www/teleroute-marketplace/public;
    }
}

# PHPMyAdmin (optional - for development only)
server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    root /usr/share/phpmyadmin;
    index index.php;

    # Only allow from localhost
    allow 127.0.0.1;
    allow ::1;
    deny all;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
