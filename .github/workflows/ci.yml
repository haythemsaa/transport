name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # =====================================================
  # PHP Linting and Code Quality
  # =====================================================
  php-lint:
    name: PHP Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, pdo, pdo_mysql
          tools: php-cs-fixer, phpstan

      - name: PHP Syntax Check
        run: find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;

      - name: Check for PHP errors
        run: |
          if find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \; | grep -i "error"; then
            echo "PHP syntax errors found"
            exit 1
          fi

  # =====================================================
  # Security Scan
  # =====================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run security scanner
        run: |
          # Check for common security issues
          echo "Checking for hardcoded credentials..."
          if grep -r -i "password.*=.*['\"].*['\"]" --include="*.php" --exclude-dir={vendor,node_modules} .; then
            echo "Warning: Possible hardcoded credentials found"
          fi

          echo "Checking for SQL injection vulnerabilities..."
          if grep -r "\$_\(GET\|POST\|REQUEST\)\[" --include="*.php" --exclude-dir={vendor,node_modules} . | grep -v "htmlspecialchars\|h("; then
            echo "Warning: Possible XSS vulnerabilities"
          fi

      - name: Check file permissions
        run: |
          # Ensure sensitive files are not executable
          if find config database -type f -perm /111 2>/dev/null; then
            echo "Warning: Config files should not be executable"
          fi

  # =====================================================
  # Database Tests
  # =====================================================
  database:
    name: Database Schema Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: teleroute_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Wait for MySQL
        run: |
          while ! mysqladmin ping -h"127.0.0.1" -P"3306" --silent; do
            sleep 1
          done

      - name: Import database schema
        run: |
          mysql -h 127.0.0.1 -u root -proot_password teleroute_test < database/schema.sql

      - name: Verify tables created
        run: |
          COUNT=$(mysql -h 127.0.0.1 -u root -proot_password teleroute_test -e "SHOW TABLES" | wc -l)
          if [ $COUNT -lt 10 ]; then
            echo "Error: Not all tables were created"
            exit 1
          fi
          echo "Database schema imported successfully"

  # =====================================================
  # Docker Build Test
  # =====================================================
  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: teleroute-marketplace:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker Compose
        run: |
          docker-compose config --quiet
          echo "Docker Compose configuration is valid"

  # =====================================================
  # Code Coverage (Optional)
  # =====================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Calculate code statistics
        run: |
          echo "=== Project Statistics ==="
          echo "PHP Files: $(find . -name '*.php' -not -path './vendor/*' | wc -l)"
          echo "JavaScript Files: $(find . -name '*.js' -not -path './node_modules/*' -not -path './vendor/*' | wc -l)"
          echo "Lines of Code (PHP): $(find . -name '*.php' -not -path './vendor/*' -exec cat {} \; | wc -l)"

  # =====================================================
  # Deployment (Production)
  # =====================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [php-lint, security, database, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "Deploying to production..."
          # Add your deployment script here
          # Example: ssh user@server "cd /var/www && git pull && ./scripts/deploy.sh production"
          echo "Deployment complete"

  # =====================================================
  # Deployment (Staging)
  # =====================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [php-lint, security, database]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          # Add your staging deployment script
          echo "Staging deployment complete"

  # =====================================================
  # Notifications
  # =====================================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [php-lint, security, database, docker]
    if: always()

    steps:
      - name: Notify on success
        if: success()
        run: echo "✅ All checks passed!"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Some checks failed!"
